<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月卡信息 - 停车缴费管理系统</title>

<style>
  /* ── 全局重置 ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; font-size: 14px; }

  /* ── 左侧侧边栏 ── */
  .sidebar { width: 220px; background: #3b5975; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar .logo { height: 64px; line-height: 64px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #0b2440; }
  .menu { list-style: none; padding-top: 10px; }
  .menu > li > a { display: block; padding: 14px 24px; color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; }
  .menu > li > a:hover, .menu > li > a.active { color: #fff; background: #1890ff; }

  /* ── 右侧主体 ── */
  .content { flex: 1; display: flex; flex-direction: column; }
  .header { height: 60px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 24px; font-size: 16px; }
  .header a { color: #1890ff; text-decoration: none; margin-right: 16px; font-size: 14px; }
  .main { padding: 24px; max-width: 700px; margin: 0 auto; width: 100%; }

  /* 白色卡片容器 */
  .box { background: #fff; border-radius: 4px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .box h3 { font-size: 15px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #ebeef5; color: #303133; }

  /*
    ── 表单 Grid 布局 ──
    grid-template-columns: repeat(2, 1fr) → 两列，宽度平分
    gap: 16px → 格子之间间隔
    知识点：CSS Grid 二维布局，适合表单这种整齐的结构
  */
  .fm { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
  .fi { display: flex; flex-direction: column; }
  .fi.full { grid-column: 1 / -1; }  /* 跨两列 */
  .fi label { font-size: 13px; color: #606266; margin-bottom: 6px; }
  .fi input, .fi select { height: 34px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
  /* 伪类 :focus：输入框获得焦点时的样式 */
  .fi input:focus, .fi select:focus { border-color: #1890ff; }
  .fi .star { color: #f56c6c; margin-right: 2px; }

  /* 错误提示 */
  .err { color: #f56c6c; font-size: 13px; margin-top: 10px; min-height: 20px; }

  /* 底部按钮 */
  .foot { text-align: center; padding: 10px 0; }
  button { height: 34px; padding: 0 28px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 0 8px; }
  button.primary { background: #1890ff; color: #fff; }
  button.primary:hover { background: #40a9ff; }
  button.default { background: #fff; color: #606266; border: 1px solid #dcdfe6; }
  button.default:hover { color: #1890ff; border-color: #1890ff; }

  /* 只读字段提示 */
  .fi input[readonly] { background: #f5f7fa; color: #606266; }
</style>
</head>

<body>

<!-- ========== 左侧侧边栏 ========== -->
<aside class="sidebar">
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu">
    <li><a href="index.html">工作台</a></li>
    <li><a href="monthCard.html" class="active">月卡管理</a></li>
  </ul>
</aside>

<!-- ========== 右侧主体 ========== -->
<div class="content">
  <div class="header">
    <!-- 返回按钮：用 history.back() 返回上一页，或者 location.href 跳回列表 -->
    <a href="monthCard.html">← 返回月卡列表</a>
    <span id="pageTitle">新增月卡</span>
  </div>
  <div class="main">

    <!-- 车辆信息卡片 -->
    <div class="box">
      <h3>车辆信息</h3>
      <div class="fm">
        <div class="fi">
          <label><span class="star">*</span>车主姓名</label>
          <input id="owner" placeholder="请输入姓名">
        </div>
        <div class="fi">
          <label><span class="star">*</span>联系方式</label>
          <input id="phone" placeholder="请输入手机号">
        </div>
        <div class="fi">
          <label><span class="star">*</span>车辆号码</label>
          <input id="plateNo" placeholder="如 京A12345">
        </div>
        <div class="fi">
          <label>车辆品牌</label>
          <input id="brand" placeholder="选填">
        </div>
      </div>
    </div>

    <!-- 缴费信息卡片 -->
    <div class="box">
      <h3>缴费信息</h3>
      <div class="fm">
        <!-- 日期跨两列 -->
        <div class="fi full">
          <label><span class="star">*</span>有效期</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input id="startDate" type="date">
            <span>至</span>
            <input id="endDate" type="date">
          </div>
        </div>
        <div class="fi">
          <label><span class="star">*</span>支付金额</label>
          <input id="amount" type="number" placeholder="单位：元">
        </div>
        <div class="fi">
          <label><span class="star">*</span>支付方式</label>
          <select id="payType">
            <option value="">请选择</option>
            <option value="微信">微信</option>
            <option value="支付宝">支付宝</option>
            <option value="现金">现金</option>
            <option value="银行卡">银行卡</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 错误提示 + 按钮 -->
    <div class="err" id="errMsg"></div>
    <div class="foot">
      <button class="primary" onclick="onSubmit()">确 定</button>
      <button class="default" onclick="onReset()">重 置</button>
    </div>

  </div>
</div>

<!-- ========== JavaScript ========== -->
<script>
  /*
    ========== 全局变量 ==========
    editId: 从 URL 读的 id 参数，null 表示新增模式，有值表示编辑模式
    知识点：URLSearchParams 解析 URL 里 ?id=5 这种 query 参数
  */
  var list = [];
  var editId = null;

  /*
    localStorage 读写（和列表页一样）
  */
  function saveData() {
    localStorage.setItem('monthCardData', JSON.stringify(list));
  }
  function loadData() {
    var s = localStorage.getItem('monthCardData');
    return s ? JSON.parse(s) : [];
  }

  /*
    ========== 表单校验 ==========
    返回空字符串 '' 表示通过，返回有内容表示错误信息
    知识点：
      1. 正则 .test(值) → true/false
      2. /^1\d{10}$/ → 1开头，11位数字
      3. /^[\u4e00-\u9fa5][A-Z][A-HJ-NP-Z0-9]{5,6}$/ → 中国车牌
  */
  function validate(d) {
    if (!d.owner) return '请输入车主姓名';
    if (!d.phone) return '请输入联系方式';
    if (!d.plateNo) return '请输入车辆号码';
    if (!d.startDate) return '请选择开始日期';
    if (!d.endDate) return '请选择结束日期';
    if (!d.amount) return '请输入支付金额';
    if (!d.payType) return '请选择支付方式';
    if (!/^1\d{10}$/.test(d.phone)) return '手机号格式不正确（11位数字，以1开头）';
    if (!/^[\u4e00-\u9fa5][A-Z][A-HJ-NP-Z0-9]{5,6}$/.test(d.plateNo)) return '车牌号码格式不正确（如 京A12345）';
    if (Number(d.amount) <= 0) return '支付金额必须为正数';
    if (new Date(d.endDate) < new Date(d.startDate)) return '结束日期不能早于开始日期';
    return '';
  }

  /*
    ========== 提交 ==========
    流程：
      1. 读表单值
      2. 校验
      3. 计算剩余天数、状态
      4. 新增 → push 到数组；编辑 → 找到下标替换
      5. saveData() 存 localStorage
      6. location.href 跳回列表
  */
  function onSubmit() {
    // 收集表单数据
    var d = {
      owner:    document.getElementById('owner').value.trim(),
      phone:    document.getElementById('phone').value.trim(),
      plateNo:  document.getElementById('plateNo').value.trim(),
      brand:    document.getElementById('brand').value.trim(),
      startDate:document.getElementById('startDate').value,
      endDate:  document.getElementById('endDate').value,
      amount:   document.getElementById('amount').value,
      payType:  document.getElementById('payType').value
    };

    // 校验
    var err = validate(d);
    if (err) {
      document.getElementById('errMsg').innerText = err;
      return;
    }
    document.getElementById('errMsg').innerText = '';

    // 计算状态
    var now = new Date(); now.setHours(0,0,0,0);
    var end = new Date(d.endDate); end.setHours(0,0,0,0);
    d.status = end >= now ? 0 : 1;  // 0=可用 1=已过期

    if (editId) {
      // 编辑模式：找到下标，替换整个对象
      var idx = list.findIndex(function(i) { return i.id === editId; });
      if (idx !== -1) {
        d.id = editId;
        list[idx] = d;
      }
    } else {
      // 新增模式：生成唯一 id，push 到数组
      // Date.now() → 当前时间戳毫秒，基本不会重复
      d.id = Date.now();
      list.push(d);
    }

    saveData();
    location.href = 'monthCard.html';  // 跳回月卡列表页
  }

  // 重置：清空所有输入框
  function onReset() {
    var inputs = document.querySelectorAll('input[type!=date], select');
    inputs.forEach(function(i) { i.value = ''; });
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    document.getElementById('errMsg').innerText = '';
  }

  /*
    ========== 页面加载初始化 ==========
    知识点：URLSearchParams 解析 URL query 参数
    如果 URL 是 addMonthCard.html?id=123 → editId = 123，编辑模式
    如果 URL 是 addMonthCard.html → editId = null，新增模式
  */
  window.onload = function() {
    list = loadData();

    // 解析 URL 参数
    var params = new URLSearchParams(location.search);
    var idStr = params.get('id');

    if (idStr) {
      // 编辑模式：找到对应数据，回显到表单
      editId = Number(idStr);
      document.getElementById('pageTitle').innerText = '编辑月卡';
      var item = list.find(function(i) { return i.id === editId; });
      if (item) {
        document.getElementById('owner').value = item.owner;
        document.getElementById('phone').value = item.phone;
        document.getElementById('plateNo').value = item.plateNo;
        document.getElementById('brand').value = item.brand;
        document.getElementById('startDate').value = item.startDate;
        document.getElementById('endDate').value = item.endDate;
        document.getElementById('amount').value = item.amount;
        document.getElementById('payType').value = item.payType;
      }
    }
  };
</script>

</body>
</html>
