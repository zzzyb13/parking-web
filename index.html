<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台 - 停车缴费管理系统</title>
<link rel="stylesheet" href="../css/index.css">
</head>

<body>

  <!------------------------------------------------------------- 左边侧边栏 -->
<aside class="sidebar">
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu">                    <!-- 侧边栏菜单 -->
    <li><a href="index.html" class="active">工作台</a></li>
    <li><a href="monthCard.html">月卡管理</a></li>
  </ul>
</aside>

  <!------------------------------------------------------------- 右边内容区域 -->
<div class="content">                    
  <div class="header">工作台首页</div>      <!-- 内容区域标题 -->
  <div class="main">

    <div class="cards">                    <!-- 四个卡片区域，横排 -->
      <div class="card blue">
        <div class="lbl">月卡车辆总数</div>
        <div class="num" id="statTotal">0</div>
      </div>
      <div class="card green">
        <div class="lbl">年度累计收费（元）</div>
        <div class="num" id="statAmount">0</div>
      </div>
      <div class="card orange">
        <div class="lbl">入驻企业总数</div>
        <div class="num">8</div>
      </div>
      <div class="card red">
        <div class="lbl">一体杆总数</div>
        <div class="num">20</div>
      </div>
    </div>

    <div class="quick">                    <!-- 快捷入口区域 -->
      <h3>快捷入口</h3>
      <a href="monthCard.html">月卡管理</a>
      <a href="addMonthCard.html">新增月卡</a>
    </div>

  </div>
</div>

<script src="../js/index.js"></script>

</body>
</html>
