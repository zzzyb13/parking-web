<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台 - 停车缴费管理系统</title>

<!-- ========== CSS 部分 ========== -->
<style>
  /* ── 1. 全局重置：通配符选择器 * ──
     * 选中页面上所有元素，清除浏览器默认的外边距、内边距
     box-sizing: border-box 让 padding 和 border 算进宽度里 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── 2. body：整个页面横向 flex 布局 ──
     display: flex 让 sidebar 和 content 左右排列
     min-height: 100vh 保证页面至少撑满整个屏幕高度，最低是一屏，内容多就自动长高，不会截断内容 */
  body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; }

  /* ── 3. 左侧侧边栏 ──
     width: 220px 固定宽度；flex-shrink: 0 防止被挤压
     flex-direction: column 让 logo 和 menu 纵向堆叠 */
  .sidebar { width: 220px; background: #3b5975; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }

  /* 侧边栏顶部 logo */
  .sidebar .logo { height: 64px; line-height: 64px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #0b2440; }

  /* 菜单列表 */
  .menu { list-style: none; padding-top: 10px; }
  /* 子选择器 > ：只选 .menu 下面的直接子 li，不会影响更深层 */
  .menu > li > a { display: block; padding: 14px 24px; color: rgba(255,255,255,.75); text-decoration: none; cursor: pointer; font-size: 14px; }
  /* 伪类 :hover 鼠标悬浮变色；.active 当前页高亮 */
  .menu > li > a:hover, .menu > li > a.active { color: #fff; background: #1890ff; }

  /* ── 4. 右侧主体区域 ──
     flex: 1 自动填满剩余宽度，column 布局，内容垂直居中 */
  .content { flex: 1; display: flex; flex-direction: column; }

  /* 顶部头部 */
  .header { height: 60px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 24px; font-size: 16px; }

  /* 页面主内容区 */
  .main { padding: 24px; }

  /* ── 5. 统计卡片 ──
     CSS Grid 网格布局：4列，每列平分 */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
  .card { background: #fff; border-radius: 4px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card .num { font-size: 28px; font-weight: bold; color: #303133; margin: 8px 0; } /* 统计数字字体 */
  .card .lbl { font-size: 14px; color: #909399; } /* 统计标签字体 */
  .card.blue .num { color: #1890ff; }   /* 后代选择器：.card 下面的 .num */
  .card.green .num { color: #67c23a; }
  .card.orange .num { color: #e6a23c; }
  .card.red   .num { color: #f56c6c; }

  /* 快捷入口 */
  .quick { background: #fff; border-radius: 4px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .quick h3 { font-size: 16px; margin-bottom: 16px; }
  .quick a { display: inline-block; padding: 10px 20px; margin-right: 12px; background: #1890ff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; }
  .quick a:hover { background: #40a9ff; } /* 快捷入口链接悬停变色 */
</style>
</head>

<body>

<!-- ========== 左侧侧边栏 ========== -->
<aside class="sidebar"> <!-- 侧边栏 ，语义化标签，专门用来表示页面侧边栏区域-->
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu"> <!-- 无序列表 -->
    <!-- 当前页用 .active 高亮 -->
    <li><a href="index.html" class="active">工作台</a></li>
    <li><a href="monthCard.html">月卡管理</a></li>
  </ul>
</aside>

<!-- ========== 右侧主体 ========== -->
<div class="content">
  <div class="header">工作台首页</div>
  <div class="main">

    <!-- 4个统计卡片 -->
    <div class="cards">
      <!-- class 可以写多个，空格分隔：.card + .blue 两个类一起生效 -->
      <div class="card blue">
        <div class="lbl">月卡车辆总数</div>
        <div class="num" id="statTotal">0</div>
      </div>
      <div class="card green">
        <div class="lbl">年度累计收费（元）</div>
        <div class="num" id="statAmount">0</div> 
      </div>
      <div class="card orange">
        <div class="lbl">入驻企业总数</div>
        <div class="num">8</div>
      </div>
      <div class="card red">
        <div class="lbl">一体杆总数</div>
        <div class="num">20</div>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div class="quick">
      <h3>快捷入口</h3>
      <a href="monthCard.html">月卡管理</a> 
      <a href="addMonthCard.html">新增月卡</a>
    </div>

  </div>
</div>

<!-- ========== JavaScript 部分 ========== -->
<script>
  /*
    知识点：
    1. localStorage.setItem('key', '值') 存数据（值必须是字符串，所以用 JSON.stringify 转一下）
    2. localStorage.getItem('key') 取数据（取出来是字符串，用 JSON.parse 转回数组）
    3. window.onload = function() { ... } 页面加载完自动执行
    4. 千分位格式：num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',')
  */

  // 模拟数据：localStorage 里没数据时用这个初始化
  var mockData = [
    { id:1, owner:'张三', phone:'13800138001', plateNo:'京A12345', brand:'大众', startDate:'2026-01-01', endDate:'2026-12-31', amount:1200, payType:'微信', status:0 },
    { id:2, owner:'李四', phone:'13900139002', plateNo:'京B67890', brand:'丰田', startDate:'2026-03-15', endDate:'2027-03-14', amount:1500, payType:'支付宝', status:0 },
    { id:3, owner:'王五', phone:'13700137003', plateNo:'京C11111', brand:'宝马', startDate:'2025-06-01', endDate:'2025-12-31', amount:1300, payType:'现金', status:1 }
  ];

  /*
    从 localStorage 读取月卡数据
    localStorage.getItem 返回字符串或 null
    JSON.parse(null) 会报错，所以用 || [] 兜底
  */
  function loadData() {
    var s = localStorage.getItem('monthCardData');
    if (!s) {
      // 第一次打开没有数据，用 mockData 初始化
      localStorage.setItem('monthCardData', JSON.stringify(mockData));
      return mockData;
    }
    return JSON.parse(s); /* 解析 JSON 字符串为数组 */
  }

  /*
    渲染首页统计卡片
    从月卡数组动态计算：
      - 月卡总数 = 数组长度
      - 年度累计收费 = 所有 amount 相加
  */
  function renderHomeStat() {
    var list = loadData();

    // 月卡总数：数组 .length
    document.getElementById('statTotal').innerText = list.length;

    // 年度累计收费：用 reduce 累加所有 amount
    // reduce 用法：数组.reduce(function(累加器, 当前项){ return 新累加值 }, 初始值)
    var totalAmount = list.reduce(function(sum, item) {
      return sum + Number(item.amount);
    }, 0);

    // 千分位格式化：12000 -> "12,000"
    document.getElementById('statAmount').innerText = totalAmount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // 页面加载完成自动执行
  window.onload = function() {
    renderHomeStat();
  };
</script>

</body>
</html>
