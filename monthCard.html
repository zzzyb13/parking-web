<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月卡管理 - 停车缴费管理系统</title>

<style>
  /* ── 全局重置 ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; display: flex; min-height: 100vh; font-size: 14px; }

  /* ── 左侧侧边栏 ── */
  .sidebar { width: 220px; background: #3b5975; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar .logo { height: 64px; line-height: 64px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #0b2440; }
  .menu { list-style: none; padding-top: 10px; }
  .menu > li > a { display: block; padding: 14px 24px; color: rgba(255,255,255,.75); text-decoration: none; font-size: 14px; }
  .menu > li > a:hover, .menu > li > a.active { color: #fff; background: #1890ff; }

  /* ── 右侧主体 ── */
  .content { flex: 1; display: flex; flex-direction: column; }
  .header { height: 60px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; padding: 0 24px; font-size: 16px; }
  .main { padding: 20px; }

  /* 白色卡片容器 */
  .box { background: #fff; border-radius: 4px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* ── 查询筛选区 ── */ /*-----------------新增-----------------*/
  .search { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search label { color: #606266; } /* 查询标签字体 */
  .search input, .search select { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
  /* 属性选择器 input[type=button]：只选按钮类型的 input */
  .search input[type=text] { width: 180px; }
  .search select { width: 120px; }

  /* 按钮统一样式 */ /*-----------------新增-----------------*/
  button, .search input[type=button] { height: 32px; padding: 0 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #1890ff; color: #fff; }
  button:hover, .search input[type=button]:hover { background: #40a9ff; }
  /* 派生选择器 .btns button：.btns 容器里的 button 更紧凑 */
  .btns button { margin-right: 10px; margin-bottom: 12px; }
  button.danger { background: #f56c6c; }
  button.danger:hover { background: #f78989; }
  button.default { background: #fff; color: #606266; border: 1px solid #dcdfe6; }
  button.default:hover { color: #1890ff; border-color: #1890ff; }

  /* ── 表格 ── */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ebeef5; }
  th { background: #fafafa; color: #606266; font-weight: 600; }
  /* 结构性伪类 :hover：鼠标悬浮的那一行 */
  tr:hover td { background: #f5f7fa; }
  /* 状态列颜色 */
  .tag-ok { color: #67c23a; }
  .tag-end { color: #f56c6c; }
  /* 操作列的链接样式 */
  .op { color: #1890ff; cursor: pointer; text-decoration: none; margin-right: 10px; }
  .op:hover { text-decoration: underline; }

  /* ── 分页 ── */
  .pager { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  .pager .info { color: #909399; }
  .pager .btns button { margin-left: 6px; min-width: 32px; }
  .pager .btns button:disabled { background: #a0cfff; cursor: not-allowed; }

  /* ── 弹窗遮罩层 ──
     默认 display:none 隐藏；加 .show 类变 display:flex 显示
     transition 让显示/隐藏有渐变动画 */
  .mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 6px; width: 560px; padding: 28px 32px; }
  .modal h3 { font-size: 16px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }

  /* 弹窗里的表单 */
  .fm { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fi { display: flex; flex-direction: column; }
  .fi.full { grid-column: 1 / -1; }  /* 跨两列 */
  .fi label { font-size: 13px; color: #606266; margin-bottom: 4px; }
  .fi input, .fi select { height: 32px; border: 1px solid #dcdfe6; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
  /* 属性选择器：只读字段样式 */
  .fi input[readonly] { background: #f5f7fa; }

  /* 弹窗底部按钮 */
  .mf { margin-top: 22px; text-align: right; }
  .mf button { margin-left: 10px; }
</style>
</head>

<body>

<!-- ========== 左侧侧边栏 ========== -->
<aside class="sidebar">
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu">
    <li><a href="index.html">工作台</a></li>
    <li><a href="monthCard.html" class="active">月卡管理</a></li>
  </ul>
</aside>

<!-- ========== 右侧主体 ========== -->
<div class="content">
  <div class="header">月卡管理</div>
  <div class="main">
    <div class="box">

      <!-- 查询筛选区 -->
      <div class="search">
        <label>车牌号：</label>
        <input type="text" id="qPlate" placeholder="输入车牌号">
        <label>状态：</label>
        <select id="qStatus">
          <option value="">全部</option>
          <option value="0">可用</option>
          <option value="1">已过期</option>
        </select>
        <input type="button" value="查询" onclick="onSearch()">
        <input type="button" value="重置" onclick="onReset()">
      </div>

      <!-- 操作按钮 -->
      <div class="btns">
        <!-- location.href 跳转页面 -->
        <button onclick="location.href='addMonthCard.html'">新增月卡</button>
        <button class="danger" onclick="onBatchDelete()">批量删除</button>
      </div>

      <!-- 表格 -->
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
            <th>序号</th>
            <th>车主</th>
            <th>联系方式</th>
            <th>车牌号</th>
            <th>品牌</th>
            <th>剩余天数</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <!-- 数据行由 JS 动态生成，tbody 留空让 JS 填 -->
        <tbody id="tb"></tbody>
      </table>

      <!-- 分页 -->
      <div class="pager">
        <div class="info" id="pageInfo"></div>
        <div class="btns">
          <button onclick="goPage(1)">首页</button>
          <button onclick="goPage(currentPage-1)">上一页</button>
          <button onclick="goPage(currentPage+1)">下一页</button>
          <button onclick="goPage(totalPage)">末页</button>
          <button class="default" onclick="changeSize()">切换每页条数</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ========== 查看弹窗 ========== -->
<!-- 默认被 CSS .mask { display:none } 隐藏，JS 加 .show 类就显示 -->
<div class="mask" id="vMask">
  <div class="modal">
    <h3>查看月卡</h3>
    <div class="fm">
      <div class="fi"><label>车主姓名</label><input id="vOwner" readonly></div>
      <div class="fi"><label>联系方式</label><input id="vPhone" readonly></div>
      <div class="fi"><label>车牌号</label><input id="vPlate" readonly></div>
      <div class="fi"><label>品牌</label><input id="vBrand" readonly></div>
      <div class="fi"><label>开始日期</label><input id="vStart" readonly></div>
      <div class="fi"><label>结束日期</label><input id="vEnd" readonly></div>
      <div class="fi"><label>支付金额</label><input id="vAmount" readonly></div>
      <div class="fi"><label>支付方式</label><input id="vPayType" readonly></div>
    </div>
    <div class="mf"><button class="default" onclick="closeMask('vMask')">关闭</button></div>
  </div>
</div>

<!-- ========== 编辑弹窗（续费复用这个） ========== -->
<div class="mask" id="eMask">
  <div class="modal">
    <!-- 续费模式下标题会被 JS 改成"续费" -->
    <h3 id="eTitle">编辑月卡</h3>
    <div class="fm">
      <div class="fi"><label>车主姓名</label><input id="eOwner"></div>
      <div class="fi"><label>联系方式</label><input id="ePhone"></div>
      <div class="fi"><label>车牌号</label><input id="ePlate"></div>
      <div class="fi"><label>品牌</label><input id="eBrand"></div>
      <div class="fi"><label>开始日期</label><input id="eStart" type="date"></div>
      <div class="fi"><label>结束日期</label><input id="eEnd" type="date"></div>
      <div class="fi"><label>支付金额</label><input id="eAmount" type="number"></div>
      <div class="fi"><label>支付方式</label>
        <select id="ePayType">
          <option value="微信">微信</option>
          <option value="支付宝">支付宝</option>
          <option value="现金">现金</option>
          <option value="银行卡">银行卡</option>
        </select>
      </div>
    </div>
    <div class="mf">
      <button class="default" onclick="closeMask('eMask')">取消</button>
      <button onclick="saveE()">确定</button>
    </div>
  </div>
</div>

<!-- ========== JavaScript ========== -->
<script>
  /*
    ========== 全局变量 ==========
    list         : localStorage 读出来的完整数据数组
    filteredList : 当前搜索过滤后的结果（分页基于这个）
    currentPage  : 当前页码，从1开始
    pageSize     : 每页条数
    editMode     : 编辑弹窗当前模式 'edit' 或 'renew'（续费）
    currentEditId: 正在编辑的月卡 id
  */
  var list = [];
  var filteredList = [];
  var currentPage = 1;
  var pageSize = 5;
  var editMode = 'edit';
  var currentEditId = null;
  var totalPage = 1;

  /*
    ========== localStorage 读写 ==========
    知识点：JSON.stringify 数组→字符串；JSON.parse 字符串→数组
  */
  function saveData() {
    localStorage.setItem('monthCardData', JSON.stringify(list));
  }
  function loadData() {
    var s = localStorage.getItem('monthCardData');
    return s ? JSON.parse(s) : [];
  }

  /*
    ========== 计算剩余天数 ==========
    new Date('2026-12-31').getTime() → 毫秒时间戳
    两个时间戳相减 ÷ 86400000（一天的毫秒数）= 天数
  */
  function calcRemain(endDate) {
    var now = new Date(); now.setHours(0,0,0,0);
    var end = new Date(endDate); end.setHours(0,0,0,0);
    var ms = end.getTime() - now.getTime();
    var days = Math.ceil(ms / 86400000);
    return days <= 0 ? 0 : days;
  }

  /*
    ========== 渲染表格 ==========
    slice(start, end) 切片：从 start 开始（含）到 end 结束（不含）
    第1页 pageSize=5 → slice(0, 5)
    第2页 → slice(5, 10)
  */
  function renderTable() {
    var tb = document.getElementById('tb');
    tb.innerHTML = '';  // 先清空旧内容

    totalPage = Math.max(1, Math.ceil(filteredList.length / pageSize));
    if (currentPage > totalPage) currentPage = totalPage;

    var s = (currentPage - 1) * pageSize;
    var pageData = filteredList.slice(s, s + pageSize);

    if (pageData.length === 0) {
      tb.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:60px;color:#c0c4cc">暂无数据</td></tr>';
    } else {
      pageData.forEach(function(item, idx) {
        var tr = document.createElement('tr');
        var statusHtml = item.status === 0
          ? '<span class="tag-ok">可用</span>'
          : '<span class="tag-end">已过期</span>';
        tr.innerHTML =
          '<td><input type="checkbox" class="rowC" value="' + item.id + '"></td>' +
          '<td>' + (s + idx + 1) + '</td>' +
          '<td>' + item.owner + '</td>' +
          '<td>' + item.phone + '</td>' +
          '<td>' + item.plateNo + '</td>' +
          '<td>' + item.brand + '</td>' +
          '<td>' + calcRemain(item.endDate) + '天</td>' +
          '<td>' + statusHtml + '</td>' +
          '<td>' +
            '<a class="op" onclick="openV(' + item.id + ')">查看</a>' +
            '<a class="op" onclick="openR(' + item.id + ')">续费</a>' +
            '<a class="op" onclick="openE(' + item.id + ')">编辑</a>' +
            '<a class="op" onclick="onDel(' + item.id + ')">删除</a>' +
          '</td>';
        tb.appendChild(tr);
      });
    }

    // 更新底部分页信息
    document.getElementById('pageInfo').innerText =
      '共 ' + filteredList.length + ' 条，第 ' + currentPage + '/' + totalPage + ' 页';
  }

  /*
    ========== 查询 ==========
    filter() 过滤数组：返回满足条件的项组成的新数组
    includes() 字符串包含判断，实现模糊搜索
  */
  function onSearch() {
    var plate = document.getElementById('qPlate').value.trim();
    var status = document.getElementById('qStatus').value;

    filteredList = list.filter(function(item) {
      var matchPlate = !plate || item.plateNo.indexOf(plate) !== -1;
      var matchStatus = status === '' || String(item.status) === status;
      return matchPlate && matchStatus;
    });

    currentPage = 1;  // 查询后重置到第1页
    renderTable();
  }

  // 重置：清空筛选条件，filteredList 恢复为完整 list
  function onReset() {
    document.getElementById('qPlate').value = '';
    document.getElementById('qStatus').value = '';
    filteredList = list.slice();  // slice() 不传参数 = 复制整个数组
    currentPage = 1;
    renderTable();
  }

  /*
    ========== 分页 ==========
  */
  function goPage(n) {
    if (n < 1 || n > totalPage) return;
    currentPage = n;
    renderTable();
  }
  function changeSize() {
    pageSize = pageSize === 5 ? 10 : 5;
    currentPage = 1;
    renderTable();
  }

  /*
    ========== 全选 / 反选 ==========
    .rowC 是每行的复选框（class="rowC"）
    querySelectorAll('.rowC') 返回所有 .rowC 元素的集合
  */
  function toggleAll(cb) {
    var cbs = document.querySelectorAll('.rowC');
    cbs.forEach(function(c) { c.checked = cb.checked; });
  }

  /*
    ========== 弹窗控制 ==========
    classList.add('show') 加类，弹窗显示
    classList.remove('show') 删类，弹窗消失
  */
  function closeMask(id) {
    document.getElementById(id).classList.remove('show');
  }
  function openMask(id) {
    document.getElementById(id).classList.add('show');
  }

  /*
    ========== 查看弹窗（只读） ==========
    用 find() 从数组里找 id 匹配的那一条数据
  */
  function openV(id) {
    var item = list.find(function(i) { return i.id === id; });
    if (!item) return;
    document.getElementById('vOwner').value = item.owner;
    document.getElementById('vPhone').value = item.phone;
    document.getElementById('vPlate').value = item.plateNo;
    document.getElementById('vBrand').value = item.brand;
    document.getElementById('vStart').value = item.startDate;
    document.getElementById('vEnd').value = item.endDate;
    document.getElementById('vAmount').value = item.amount;
    document.getElementById('vPayType').value = item.payType;
    openMask('vMask');
  }

  /*
    ========== 编辑弹窗 ==========
    全部字段可改
  */
  function openE(id) {
    var item = list.find(function(i) { return i.id === id; });
    if (!item) return;
    editMode = 'edit';
    currentEditId = id;
    document.getElementById('eTitle').innerText = '编辑月卡';
    document.getElementById('eOwner').value = item.owner;
    document.getElementById('ePhone').value = item.phone;
    document.getElementById('ePlate').value = item.plateNo;
    document.getElementById('eBrand').value = item.brand;
    document.getElementById('eStart').value = item.startDate;
    document.getElementById('eEnd').value = item.endDate;
    document.getElementById('eAmount').value = item.amount;
    document.getElementById('ePayType').value = item.payType;
    openMask('eMask');
  }

  /*
    ========== 续费弹窗 ==========
    复用编辑弹窗，但车辆信息只读（input 设置 readonly）
    允许改的只有：开始日期、结束日期、金额、支付方式
  */
  function openR(id) {
    var item = list.find(function(i) { return i.id === id; });
    if (!item) return;
    editMode = 'renew';
    currentEditId = id;
    document.getElementById('eTitle').innerText = '续费';
    // 车辆信息只读
    document.getElementById('eOwner').value = item.owner;
    document.getElementById('eOwner').readOnly = true;
    document.getElementById('ePhone').value = item.phone;
    document.getElementById('ePhone').readOnly = true;
    document.getElementById('ePlate').value = item.plateNo;
    document.getElementById('ePlate').readOnly = true;
    document.getElementById('eBrand').value = item.brand;
    document.getElementById('eBrand').readOnly = true;
    // 缴费信息可改（延长结束日期）
    document.getElementById('eStart').value = item.startDate;
    document.getElementById('eEnd').value = item.endDate;
    document.getElementById('eAmount').value = item.amount;
    document.getElementById('ePayType').value = item.payType;
    openMask('eMask');
  }

  /*
    ========== 保存编辑 ==========
    findIndex() 找到该 id 在数组里的下标
    直接修改 list[idx] 的属性，然后存回 localStorage
  */
  function saveE() {
    var idx = list.findIndex(function(i) { return i.id === currentEditId; });
    if (idx === -1) return;

    list[idx].owner = document.getElementById('eOwner').value;
    list[idx].phone = document.getElementById('ePhone').value;
    list[idx].plateNo = document.getElementById('ePlate').value;
    list[idx].brand = document.getElementById('eBrand').value;
    list[idx].startDate = document.getElementById('eStart').value;
    list[idx].endDate = document.getElementById('eEnd').value;
    list[idx].amount = document.getElementById('eAmount').value;
    list[idx].payType = document.getElementById('ePayType').value;

    // 重新计算状态：结束日期 >= 今天 → 可用(0)，否则 已过期(1)
    var now = new Date(); now.setHours(0,0,0,0);
    var e = new Date(list[idx].endDate); e.setHours(0,0,0,0);
    list[idx].status = e >= now ? 0 : 1;

    // 续费模式：用完要把 readonly 去掉，不影响下一次编辑
    if (editMode === 'renew') {
      document.getElementById('eOwner').readOnly = false;
      document.getElementById('ePhone').readOnly = false;
      document.getElementById('ePlate').readOnly = false;
      document.getElementById('eBrand').readOnly = false;
    }

    saveData();
    closeMask('eMask');
    filteredList = filteredList.filter(function(i) { return i.id !== currentEditId; });
    onSearch();  // 重新过滤+渲染
  }

  /*
    ========== 删除 ==========
    confirm() 浏览器原生确认弹窗，点确定返回 true
  */
  function onDel(id) {
    if (!confirm('确认删除该条数据？')) return;
    list = list.filter(function(i) { return i.id !== id; });
    filteredList = filteredList.filter(function(i) { return i.id !== id; });
    saveData();
    renderTable();
  }

  /*
    ========== 批量删除 ==========
    1. 拿到所有勾选的 .rowC 里 value（即 id）
    2. 从 list 里过滤掉这些 id
  */
  function onBatchDelete() {
    var cbs = document.querySelectorAll('.rowC:checked');
    if (cbs.length === 0) { alert('请先勾选要删除的记录'); return; }
    if (!confirm('确认删除选中的 ' + cbs.length + ' 条数据？')) return;

    var ids = [];
    cbs.forEach(function(c) { ids.push(Number(c.value)); });

    list = list.filter(function(i) { return ids.indexOf(i.id) === -1; });
    saveData();
    onSearch();
  }

  /*
    ========== 页面加载初始化 ==========
  */
  window.onload = function() {
    list = loadData();
    filteredList = list.slice();  // 初始化为完整数据
    renderTable();
  };
</script>

</body>
</html>
