<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月卡管理 - 停车缴费管理系统</title>
<link rel="stylesheet" href="../css/monthCard.css">
</head>

<body>

  <!------------------------------------------------------------- 左边侧边栏 -->
<aside class="sidebar">
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu">
    <li><a href="index.html">工作台</a></li>
    <li><a href="monthCard.html" class="active">月卡管理</a></li>
  </ul>
</aside>

  <!------------------------------------------------------------- 右边内容区域 -->
<div class="content">                    
  <div class="header">月卡管理</div>    <!-- 内容区域标题 -->
  <div class="main">
    <div class="box">

      <div class="search">                    <!------------------- 查询区域 -->
        <label>车牌号：</label>
        <input type="text" id="qPlate" placeholder="输入车牌号"> <!-- 车牌号输入框 -->
        <label>状态：</label>
        <select id="qStatus"> <!-- 状态选择框 -->
          <option value="">全部</option>
          <option value="0">可用</option>
          <option value="1">已过期</option>
        </select>
        <input type="button" value="查询" onclick="onSearch()"> <!-- 查询按钮 -->
        <input type="button" value="重置" onclick="onReset()"> <!-- 重置按钮 -->
      </div>

      <div class="btns">                    <!------------------- 操作按钮区域 -->
        <button onclick="location.href='addMonthCard.html'">新增月卡</button> <!-- 新增按钮 -->
        <button class="danger" onclick="onBatchDelete()">批量删除</button> <!-- 批量删除按钮 -->
      </div>

      <table>                               <!------------------- 表格区域 -->
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th> <!-- 全选复选框 -->
            <th>序号</th>
            <th>车主</th>
            <th>联系方式</th>
            <th>车牌号</th>
            <th>品牌</th>
            <th>剩余天数</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody> <!-- 表格主体区域 -->
      </table>

      <div class="pager">                    <!------------------- 分页区域 -->
        <div class="info" id="pageInfo"></div> <!-- 分页信息区域 -->
        <div class="btns">                    <!--- 分页按钮区域 -->
          <button onclick="goPage(1)">首页</button>
          <button onclick="goPage(currentPage-1)">上一页</button>
          <button onclick="goPage(currentPage+1)">下一页</button>
          <button onclick="goPage(totalPage)">末页</button>
          <button class="default" onclick="changeSize()">切换每页条数</button>
        </div>
      </div>

    </div>
  </div>
</div>

  <!------------------------------------------------------------- 隐藏弹窗 -->
<div class="mask" id="vMask">                 <!-- 查看月卡弹窗 -->
  <div class="modal">
    <h3>查看月卡</h3>
    <div class="fm">
      <div class="fi"><label>车主姓名</label><input id="vOwner" readonly></div> <!-- 车主姓名输入框 ，只读 -->
      <div class="fi"><label>联系方式</label><input id="vPhone" readonly></div> 
      <div class="fi"><label>车牌号</label><input id="vPlate" readonly></div>
      <div class="fi"><label>品牌</label><input id="vBrand" readonly></div>
      <div class="fi"><label>开始日期</label><input id="vStart" readonly></div>
      <div class="fi"><label>结束日期</label><input id="vEnd" readonly></div>
      <div class="fi"><label>支付金额</label><input id="vAmount" readonly></div>
      <div class="fi"><label>支付方式</label><input id="vPayType" readonly></div>
    </div>
    <div class="mf"><button class="default" onclick="closeMask('vMask')">关闭</button></div>
  </div>
</div>

<div class="mask" id="eMask">                 <!-- 编辑月卡弹窗 -->
  <div class="modal">
    <h3 id="eTitle">编辑月卡</h3>
    <div class="fm">
      <div class="fi"><label>车主姓名</label><input id="eOwner"></div>
      <div class="fi"><label>联系方式</label><input id="ePhone"></div>
      <div class="fi"><label>车牌号</label><input id="ePlate"></div>
      <div class="fi"><label>品牌</label><input id="eBrand"></div>
      <div class="fi"><label>开始日期</label><input id="eStart" type="date"></div>
      <div class="fi"><label>结束日期</label><input id="eEnd" type="date"></div>
      <div class="fi"><label>支付金额</label><input id="eAmount" type="number"></div>
      <div class="fi"><label>支付方式</label>
        <select id="ePayType">
          <option value="微信">微信</option>
          <option value="支付宝">支付宝</option>
          <option value="现金">现金</option>
          <option value="银行卡">银行卡</option>
        </select>
      </div>
    </div>
    <div class="mf">
      <button class="default" onclick="closeMask('eMask')">取消</button>
      <button onclick="saveE()">确定</button>
    </div>
  </div>
</div>

<script src="../js/monthCard.js"></script>

</body>
</html>
