<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>月卡信息 - 停车缴费管理系统</title>
<link rel="stylesheet" href="../css/addMonthCard.css">
</head>

<body>

  <!------------------------------------------------------------- 侧边栏 -->
  <aside class="sidebar">
  <div class="logo">停车缴费管理系统</div>
  <ul class="menu">
    <li><a href="index.html">工作台</a></li>
    <li><a href="monthCard.html" class="active">月卡管理</a></li>
  </ul>
</aside>

  <!------------------------------------------------------------- 内容区域 -->
<div class="content">
  <div class="header">
    <a href="monthCard.html">← 返回月卡列表</a>
    <span id="pageTitle">新增月卡</span>
  </div>
  <div class="main">

    <div class="box">                           <!-- 车辆信息区域 -->
      <h3>车辆信息</h3>
      <div class="fm">
        <div class="fi">
          <label><span class="star">*</span>车主姓名</label>
          <input id="owner" placeholder="请输入姓名">
        </div>
        <div class="fi">
          <label><span class="star">*</span>联系方式</label>
          <input id="phone" placeholder="请输入手机号">
        </div>
        <div class="fi">
          <label><span class="star">*</span>车辆号码</label>
          <input id="plateNo" placeholder="如 京A12345">
        </div>
        <div class="fi">
          <label>车辆品牌</label>
          <input id="brand" placeholder="选填">
        </div>
      </div>
    </div>

    <div class="box">                             <!-- 缴费信息区域 -->
      <h3>缴费信息</h3>
      <div class="fm">
        <div class="fi full"> <!-- 有效期输入框,跨两列 -->
          <label><span class="star">*</span>有效期</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input id="startDate" type="date" > <!-- type="date" 会让浏览器弹出日期选择器 -->
            <span>至</span>
            <input id="endDate" type="date">
          </div>
        </div>
        <div class="fi">
          <label><span class="star">*</span>支付金额</label>
          <input id="amount" type="number" placeholder="单位：元">
        </div>
        <div class="fi">
          <label><span class="star">*</span>支付方式</label>
          <select id="payType">
            <option value="">请选择</option>
            <option value="微信">微信</option>
            <option value="支付宝">支付宝</option>
            <option value="现金">现金</option>
            <option value="银行卡">银行卡</option>
          </select>
        </div>
      </div>
    </div>

    <div class="err" id="errMsg"></div>              <!-- 错误信息区域 -->
    <div class="foot">
      <button type="button" class="primary" onclick="onSubmit()">确 定</button>
      <button type="button" class="default" onclick="onReset()">重 置</button>
    </div>

  </div>
</div>

<script src="../js/addMonthCard.js"></script>

</body>
</html>
